name = "md-api"
main = "./src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = [ "nodejs_compat" ]

# 保留 console 输出到 Workers Logs，否则 OAuth / webhook / D1 报错只能靠实时 wrangler tail 捕捉
[observability]
enabled = true

# 自定义域名（zone tangzhihong.com 在同一 Cloudflare 账号下，部署时自动创建 DNS）
[[routes]]
pattern = "md-api.tangzhihong.com"
custom_domain = true

# D1 数据库绑定（self-hosted 实例，资源标识符非密钥）。
[[d1_databases]]
binding = "DB"
database_name = "md-sync"
database_id = "68031817-5534-4173-9045-ce1b97f48efa"
migrations_dir = "migrations"

# 分享页静态资源（favicon 等）
[assets]
directory = "./public"
binding = "ASSETS"

# 非敏感变量（可直接提交）。生产部署时按需覆盖。
[vars]
# 前端来源白名单，用于 CORS 与「登录后回跳到发起方」。
# 支持通配符 `*`（匹配单个主机标签）。第一个非通配项作为默认回跳地址。
# 仅列生产站：该名单同时是 OAuth 回跳白名单，登录后的 JWT 会以 URL fragment 交付给
# 名单内任意来源，因此不要在生产配置里保留 localhost。本地开发在 .dev.vars 里覆盖。
APP_URL = "https://md.tangzhihong.com"

# 爱发电（本实例未接入赞助计费，留空即关闭相关入口与 webhook 处理）
AFDIAN_USER_ID = ""
AFDIAN_PRO_PLAN_IDS = ""

# 默认图床上传 API（UPLOAD_ENABLED + 前端 VITE_UPLOAD_VIA_API 共同控制）
# Self-hosted deployment: official shared image hosting disabled, configure your own in the frontend.
UPLOAD_ENABLED = "false"
UPLOAD_BACKEND = "github"
UPLOAD_GITHUB_USERNAME = "bucketio"
# 留空则默认 img0–img19
UPLOAD_GITHUB_REPO_LIST = ""
UPLOAD_GITHUB_BRANCH = "main"
UPLOAD_GITHUB_USE_CDN = "true"

# 以下为敏感变量，请勿写入此文件，使用 `wrangler secret put` 设置：
#   wrangler secret put GITHUB_CLIENT_ID
#   wrangler secret put GITHUB_CLIENT_SECRET
#   wrangler secret put JWT_SECRET
#   wrangler secret put AFDIAN_API_TOKEN
#   wrangler secret put AFDIAN_WEBHOOK_TOKEN   # 可选：爱发电 Webhook 路径密钥
#   wrangler secret put UPLOAD_GITHUB_TOKENS_BUCKETIO   # 图床 GitHub PAT，逗号分隔（UPLOAD_ENABLED 时必填）
#   wrangler secret put ADMIN_GITHUB_LOGINS   # 主题/组件市场审核管理员（GitHub login，逗号分隔）
